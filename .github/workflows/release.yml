name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validated-source-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked maintainer tooling
        run: npm ci
      - name: Verify that the tag matches the distribution version
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; const version = JSON.parse(readFileSync('package.json', 'utf8')).version; if (process.env.GITHUB_REF_NAME !== 'v' + version) throw new Error('Tag must be v' + version);"
      - name: Run release validation
        run: npm run check && npm run sync:verify
      - name: Build the clean tagged submission package
        run: npm run package:submission -- --require-clean --require-tag
      - name: Build a source snapshot and checksums
        env:
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          git archive --format=zip --output="dist/${REPOSITORY}-${GITHUB_REF_NAME}-source.zip" HEAD
          sha256sum dist/*.zip > dist/SHA256SUMS
      - name: Publish validated source and submission artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes "Validated community source and skills-only submission artifacts. This is not a marketplace approval or production-readiness claim; see docs/compatibility.md, review/openai-submission.md, and review/release-checklist.md."
